name: Validate Flet migration

on:
  push:
    branches:
      - main
      - "migration/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UI test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==1.1.2 PyYAML

      - name: Compile application and tests
        run: python -m compileall -q ChansonVivante.py chansonvivante tests

      - name: Run Flet component and interaction regression tests
        run: python -m unittest discover -s tests -v
