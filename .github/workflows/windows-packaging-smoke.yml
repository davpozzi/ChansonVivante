name: Windows packaging smoke test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build standalone Windows application
        run: >-
          flet pack ChansonVivante.py --yes --onedir
          --name ChansonVivante --icon logo.ico
          --product-name ChansonVivante --file-description ChansonVivante
          --product-version "0.0.0"
          --company-name ChansonVivante
          --add-data "logo.ico;." --hidden-import demucs.api
          --pyinstaller-build-args=--clean
          --pyinstaller-build-args=--debug=noarchive
          --pyinstaller-build-args=--collect-all=flet
          --pyinstaller-build-args=--collect-all=flet_desktop
          --pyinstaller-build-args=--collect-all=torch
          --pyinstaller-build-args=--collect-all=torchaudio
          --pyinstaller-build-args=--collect-all=demucs
          --pyinstaller-build-args=--collect-all=soundfile
          --pyinstaller-build-args=--collect-all=imageio_ffmpeg
          --pyinstaller-build-args=--collect-all=huggingface_hub
          --pyinstaller-build-args=--collect-all=safetensors
          --pyinstaller-build-args=--collect-all=omegaconf

      - name: Verify executable and Windows version metadata
        shell: pwsh
        run: |
          $exe = "dist\ChansonVivante\ChansonVivante.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable was not created: $exe" }

          $file = Get-Item $exe
          if ($file.Length -lt 100KB) { throw "Executable looks invalid or truncated: $($file.Length) bytes" }

          $version = $file.VersionInfo
          $expected = @{
            ProductName = "ChansonVivante"
            FileDescription = "ChansonVivante"
            CompanyName = "ChansonVivante"
            ProductVersion = "0.0.0"
          }
          foreach ($property in $expected.Keys) {
            $actual = $version.$property
            if ($actual -ne $expected[$property]) {
              throw "Unexpected $property metadata. Expected '$($expected[$property])', got '$actual'."
            }
            Write-Host "$property = $actual"
          }

          $iconCandidates = @(
            "dist\ChansonVivante\logo.ico",
            "dist\ChansonVivante\_internal\logo.ico"
          )
          $bundledIcon = $iconCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bundledIcon) {
            throw "Application icon was not included in the packaged directory (checked root and _internal)."
          }
          Write-Host "Bundled application icon: $bundledIcon"
          Write-Host "Windows package smoke test passed ($($file.Length) bytes)."

      - name: Upload packaged application for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ChansonVivante-windows-smoke
          path: dist/ChansonVivante/
          if-no-files-found: error
          retention-days: 7
