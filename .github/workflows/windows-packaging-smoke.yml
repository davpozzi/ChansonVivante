name: Windows UI migration packaging smoke test

on:
  push:
    branches:
      - "migration/**"
    paths:
      - "ChansonVivante.py"
      - "chansonvivante/**"
      - "requirements.txt"
      - "logo.ico"
      - ".github/workflows/windows-packaging-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "ChansonVivante.py"
      - "chansonvivante/**"
      - "requirements.txt"
      - "logo.ico"
      - ".github/workflows/windows-packaging-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build standalone Windows application
        run: >-
          flet pack ChansonVivante.py --yes --onedir
          --name ChansonVivante --icon logo.ico
          --product-name ChansonVivante --file-description ChansonVivante
          --product-version "0.0.0"
          --company-name ChansonVivante
          --add-data "logo.ico;." --hidden-import demucs.api
          --pyinstaller-build-args=--clean
          --pyinstaller-build-args=--debug=noarchive
          --pyinstaller-build-args=--collect-all=flet
          --pyinstaller-build-args=--collect-all=flet_desktop
          --pyinstaller-build-args=--collect-all=torch
          --pyinstaller-build-args=--collect-all=torchaudio
          --pyinstaller-build-args=--collect-all=demucs
          --pyinstaller-build-args=--collect-all=soundfile
          --pyinstaller-build-args=--collect-all=imageio_ffmpeg
          --pyinstaller-build-args=--collect-all=huggingface_hub
          --pyinstaller-build-args=--collect-all=safetensors
          --pyinstaller-build-args=--collect-all=omegaconf

      - name: Verify executable and Windows version metadata
        shell: pwsh
        run: |
          $exe = "dist\ChansonVivante\ChansonVivante.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable was not created: $exe" }

          $file = Get-Item $exe
          if ($file.Length -lt 100KB) { throw "Executable looks invalid or truncated: $($file.Length) bytes" }

          $version = $file.VersionInfo
          $expected = @{
            ProductName = "ChansonVivante"
            FileDescription = "ChansonVivante"
            CompanyName = "ChansonVivante"
            ProductVersion = "0.0.0"
          }
          foreach ($property in $expected.Keys) {
            $actual = $version.$property
            if ($actual -ne $expected[$property]) {
              throw "Unexpected $property metadata. Expected '$($expected[$property])', got '$actual'."
            }
            Write-Host "$property = $actual"
          }

          $iconCandidates = @(
            "dist\ChansonVivante\logo.ico",
            "dist\ChansonVivante\_internal\logo.ico"
          )
          $bundledIcon = $iconCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bundledIcon) {
            throw "Application icon was not included in the packaged directory."
          }
          Write-Host "Bundled application icon: $bundledIcon"
          Write-Host "Windows package smoke test passed ($($file.Length) bytes)."

      - name: Smoke-test packaged application startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist\ChansonVivante\ChansonVivante.exe").Path
          $startupLog = Join-Path $env:LOCALAPPDATA "ChansonVivante\logs\startup.log"
          if (Test-Path $startupLog) { Remove-Item $startupLog -Force }

          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(25)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged application exited during startup with code $($process.ExitCode)."
              }
            } while ((Get-Date) -lt $deadline)

            if (-not (Test-Path $startupLog)) {
              throw "Application process stayed alive but did not write its startup diagnostic."
            }
            $diagnostic = Get-Content $startupLog -Raw
            if ($diagnostic -notmatch "frozen=True") {
              throw "Startup diagnostic does not confirm a frozen executable: $diagnostic"
            }
            Write-Host "Packaged application remained running for 25 seconds."
            Write-Host "Startup diagnostic: $diagnostic"
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload packaged application for inspection
        uses: actions/upload-artifact@v4
        with:
          name: ChansonVivante-windows-migration-smoke
          path: dist/ChansonVivante/
          if-no-files-found: error
          retention-days: 7
